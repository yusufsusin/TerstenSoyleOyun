<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medya İndirici</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="card">
    <h1>Medya İndirici</h1>
    <p class="subtitle">Instagram, Twitter/X, YouTube ve daha fazlası için linki yapıştır</p>

    <form id="download-form">
      <input type="url" id="url-input" placeholder="https://..." required>

      <div class="options">
        <label><input type="radio" name="type" value="video" checked> Video</label>
        <label><input type="radio" name="type" value="audio"> MP3</label>
      </div>

      <button type="submit" id="download-btn">İndir</button>
    </form>

    <p id="status" class="status"></p>

    <p class="disclaimer">Sadece indirme hakkına sahip olduğun içerikleri indir.</p>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
